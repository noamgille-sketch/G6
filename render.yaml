services:
  - type: web
    name: g6-guard
    runtime: python
    # Free plan: no permanent disk, and the container is replaced when the
    # service sleeps or redeploys. Scan results are therefore lost on a
    # restart - which is fine when you only need the verdict as it arrives.
    #
    # Verification links survive it: they are signed with G6_SECRET_KEY and
    # carry their own data, so a link keeps working even when the database
    # behind it is gone. The one consequence is that after a restart a link
    # can be used a second time, because "already used" was stored in that
    # database.
    #
    # For permanent history, switch plan to "starter" and add:
    #   disk:
    #     name: g6-data
    #     mountPath: /var/g6data
    #     sizeGB: 1
    #   and an env var G6_DB_PATH = /var/g6data/g6guard.sqlite3
    plan: free
    buildCommand: pip install -r requirements.txt && python fetch_scanner.py
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      # Accounts. Set this in the Render dashboard.
      #   G6_ACCOUNTS = noam:monmotdepasse,collegue:sonmotdepasse
      # The app refuses to start without it.
      - key: G6_ACCOUNTS
        sync: false

      # Signs both the login sessions and the verification links. Render
      # generates it once and keeps it, so links stay valid across restarts.
      # Changing it invalidates every link already sent.
      - key: G6_SECRET_KEY
        generateValue: true

      # Only needed if the repository is private, so the build can download
      # G6Scan.exe from your releases.
      - key: GITHUB_TOKEN
        sync: false

      - key: PYTHON_VERSION
        value: "3.11"
