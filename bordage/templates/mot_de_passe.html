{% extends "base.html" %}
{% block contenu %}
<div class="carte" style="max-width:420px">
  <h1>Changer mon mot de passe</h1>
  <form method="post" class="form-colonne">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Mot de passe actuel <input type="password" name="actuel" required></label>
    <label>Nouveau mot de passe <input type="password" name="nouveau" required minlength="6"></label>
    <button class="bouton">Enregistrer</button>
  </form>
</div>
{% endblock %}
