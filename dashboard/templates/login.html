<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · G6 Guard</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="logo">G6</span>
      <span>
        <span class="rail-name">Guard</span><br>
        <span class="rail-sub">anticheat FiveM</span>
      </span>
    </div>

    <h1>Connexion</h1>
    <p class="sub">Console privée. Accès réservé aux comptes configurés.</p>

    {% if error %}
      <div class="alert alert-warn">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="text" id="username" name="username" placeholder="Identifiant"
             autocomplete="username" required autofocus>
      <input type="password" id="password" name="password" placeholder="Mot de passe"
             autocomplete="current-password" required>
      <button class="btn btn-brand" type="submit">Se connecter</button>
    </form>
  </div>
</div>

</body>
</html>
