{% extends "base.html" %}
{% block title %}Connexion &middot; G6 Guard{% endblock %}
{% block content %}

<div class="login-box">
  <h1>Connexion</h1>
  <p class="muted">Dashboard privé. Seuls les comptes configurés peuvent entrer.</p>

  {% if error %}
    <p class="notice notice-warn">{{ error }}</p>
  {% endif %}

  <form method="post">
    <input type="text" name="username" placeholder="Identifiant" autocomplete="username" required autofocus>
    <input type="password" name="password" placeholder="Mot de passe" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit">Se connecter</button>
  </form>
</div>

{% endblock %}
