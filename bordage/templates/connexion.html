{% extends "base.html" %}
{% from "_macros.html" import ecran_connexion with context %}
{% block titre %}Connexion{% endblock %}
{% block hors_connexion %}{% call ecran_connexion() %}
  <h1>Connexion</h1>
  <p class="muted">Accès réservé aux responsables de production.</p>
  <form method="post" class="form-colonne">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Identifiant <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" required></label>
    <label>Mot de passe <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="bouton large">Se connecter</button>
  </form>
{% endcall %}{% endblock %}
